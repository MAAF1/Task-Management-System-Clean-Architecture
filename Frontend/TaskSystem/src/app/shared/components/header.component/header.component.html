<nav class="navbar"> <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">
      <i class="bi bi-cpu-fill"></i>
      <span class="brand-task">Task</span><span class="brand-pro">Pro</span>
    </a>

    <div class="nav-right"> @if(authService.isLoggedIn()) {
        <span class="welcome-text">
          Welcome, <strong>{{ username }}</strong>
        </span>

        <div class="header-actions">
          @if(authService.isSuperAdmin() || authService.isAdmin()) {
            <a routerLink="/admindashboard"
               routerLinkActive="is-active"
               class="btn-switch"> Admin Dashboard </a>
               
            <a routerLink="/createtask"
               routerLinkActive="is-active"
               class="btn-switch"> Create Task </a>
          } @else if(authService.isUser()) {
            <a routerLink="/dashboard"
               routerLinkActive="is-active"
               class="btn-switch">
               <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
            </a>
            
            
          }

          

          <button class="btn-logout-custom" (click)="logout()" title="Logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
          </button>
        </div>
      }
      
       @else {
        <div class="auth-buttons">
          <a routerLink="/login" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="btn-switch">Login</a>
          <a routerLink="/register" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="btn-switch">Register</a>
        </div>
      }
    </div>
  </div>
</nav>
