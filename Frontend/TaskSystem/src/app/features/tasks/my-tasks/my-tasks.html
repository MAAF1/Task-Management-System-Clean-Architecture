<div class="user-workspace-wrapper py-5">
  <div class="container">
    <div class="workspace-header mb-5">
      <h1 class="fw-bold">My Workspace</h1>
      <p class="text-muted">Track and manage your daily tasks with ease.</p>
    </div>

    <div class="tasks-grid">
      @for (task of myTasks; track task.taskId) {
        <div class="task-card-v2 {{ TaskStatus[task.userTaskStatus] }}" (click)="openTask(task)">
          
          <div class="card-header-v2">
            <span class="status-pill {{ TaskStatus[task.userTaskStatus] }}">
              <i class="bi bi-circle-fill small me-1"></i>
              {{ TaskStatus[task.userTaskStatus] }}
            </span>
            <i class="bi bi-three-dots-vertical text-muted"></i>
          </div>

          <h5 class="task-title-v2">{{ task.title }}</h5>
          <p class="task-desc-v2">{{ task.description || 'No description provided' }}</p>

          <div class="card-footer-v2">
            <div class="date-info">
              <i class="bi bi-calendar3 me-2"></i>
              <span>{{ task.dueDate | date:'MMM d, y' }}</span>
            </div>
            
            <div class="action-link">
              View details <i class="bi bi-arrow-right ms-1"></i>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
