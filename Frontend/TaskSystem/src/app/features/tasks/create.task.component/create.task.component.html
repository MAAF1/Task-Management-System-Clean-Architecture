 <div class="admin-detail-wrapper py-5"> <div class="container custom-form-container">
    
    <div class="detail-header mb-4">
      <h2 class="fw-bold m-0 text-dark">Create New Task</h2>
      <p class="text-muted small">Fill in the details to deploy a new mission</p>
    </div>

    <div class="glass-card p-4"> <h5 class="section-title mb-4 text-primary">
        <i class="bi bi-plus-circle-fill"></i> Task Specification
      </h5>

      @if (error) {
        <div class="alert alert-danger rounded-3">{{ error }}</div>
      }

      <form (ngSubmit)="createTask()">
        <div class="mb-4">
          <label class="custom-label">Task Title</label>
          <input type="text" class="custom-input" [(ngModel)]="task.title" name="title" placeholder="Enter task name..." required>
        </div>

        <div class="mb-4">
          <label class="custom-label">Due Date</label>
          <div class="date-input-wrapper">
             <input type="date" class="custom-input" [(ngModel)]="task.dueDate" name="dueDate">
          </div>
        </div>

        <div class="mb-4">
          <label class="custom-label">Description</label>
          <textarea class="custom-input" rows="4" [(ngModel)]="task.description" name="description" placeholder="Describe the task..."></textarea>
        </div>

        <div class="mb-4">
          <label class="custom-label">Assign Team Members (Hold Ctrl/Cmd)</label>
          <select multiple class="custom-select" [(ngModel)]="task.assignedUserIds" name="assignedUsers">
            @for (user of allUsers; track user.id) {
              <option [value]="user.id">{{ user.name }}</option>
            }
          </select>
          <div class="mt-2">
             <small class="text-muted fw-bold">Selected IDs: </small>
             <span class="badge bg-light text-primary border shadow-sm">{{ task.assignedUserIds | json }}</span>
          </div>
        </div>

        <button type="submit" class="btn-save-main px-5" [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span> Deploying...
          } @else {
            <i class="bi bi-rocket-takeoff me-2"></i> Create Task
          }
        </button>
      </form>
    </div>
  </div>
</div>
