<div class="admin-detail-wrapper py-5">
  <div class="container custom-form-container">
    
    @if (!loading && taskDetails) {
      <div class="detail-header d-flex justify-content-between align-items-end mb-4">
        <div>
          
          <h2 class="fw-bold m-0 text-dark">Control Panel</h2>
          <p class="text-muted small">Editing Task: <span class="fw-bold text-primary">{{ taskDetails.title }}</span></p>
        </div>
        <button class="btn-delete-task" (click)="deleteTask()">
          <i class="bi bi-trash3 me-1"></i> Delete
        </button>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="glass-card p-4 h-100">
            <h5 class="section-title mb-4 text-primary"><i class="bi bi-info-circle-fill"></i> Task Info</h5>
            
            <div class="mb-3">
              <label class="custom-label">Task Title</label>
              <input type="text" class="custom-input" [(ngModel)]="taskDetails.title">
            </div>
            
            <div class="mb-3">
              <label class="custom-label">Due Date</label>
              <div class="date-input-wrapper">
                 <i class="bi bi-calendar3"></i>
                 <input type="date" class="custom-input ps-5" [(ngModel)]="taskDetails.dueDate">
              </div>
            </div>

            <div class="mb-4">
              <label class="custom-label">Description</label>
              <textarea class="custom-input" rows="5" [(ngModel)]="taskDetails.description"></textarea>
            </div>

            <button class="btn-save-main w-100" (click)="updateTask()">
              <i class="bi bi-check2-all me-2"></i> Update Task Details
            </button>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="d-flex flex-column gap-4 h-100">
            <div class="glass-card p-4 border-top-success flex-fill">
              <h6 class="section-title text-success mb-3"><i class="bi bi-person-plus"></i> Assign Team</h6>
              <select multiple class="custom-select" [(ngModel)]="selectedUserIdsToAssign">
                @for (user of allUsers; track user.id) {
                  <option [value]="user.id">{{ user.name }}</option>
                }
              </select>
              <button class="btn-action-green w-100 mt-2" (click)="assignUser()" [disabled]="selectedUserIdsToAssign.length === 0">
                Confirm Assignment
              </button>
            </div>

            <div class="glass-card p-4 border-top-danger flex-fill">
              <h6 class="section-title text-danger mb-3"><i class="bi bi-people"></i> Active Members</h6>
              <div class="assigned-chips mb-3">
                @for (u of taskDetails.assignedUsers; track u.userId) {
                  <span class="user-chip">
                    {{ u.userName }}
                    <i class="bi bi-x" (click)="selectedUserIdsToRemove = [u.userId]; removeUser()"></i>
                  </span>
                } @empty {
                  <div class="empty-state">No one assigned</div>
                }
              </div>
              <select multiple class="custom-select" [(ngModel)]="selectedUserIdsToRemove">
                 @for (assigned of taskDetails.assignedUsers; track assigned.userId) {
                    <option [value]="assigned.userId">{{ assigned.userName }}</option>
                  }
              </select>
              <button class="btn-action-red w-100 mt-2" (click)="removeUser()" [disabled]="selectedUserIdsToRemove.length === 0">
                Remove Selected
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
